name: CVD Scanner 501
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests pandas --quiet
      - run: python cvd.pyname: CVD Scanner 501

on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 4-10 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          pip install yfinance requests pandas
      - name: Run scanner
        run: |
          python cvd.py
