name: CVD Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 3-10 * * 1-5'
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas requests
      - run: python cvd.py
