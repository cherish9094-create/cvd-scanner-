name: CVD Scanner 500
on:
  schedule:
    - cron: '30 3 * * 1-5'   # 9:00 AM IST
    - cron: '45 3 * * 1-5'   # 9:15 AM IST backup
    - cron: '0 4 * * 1-5'    # 9:30 AM IST backup
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install deps
        run: pip install yfinance pandas requests
      - name: Run CVD Scanner
        run: python cvd.py
